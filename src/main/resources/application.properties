# JPA / Hibernate
# "update" auto-creates/updates tables from entities \u2014 fine for dev.
# Switch to "validate" once you introduce a real migration tool (Flyway/Liquibase) for prod.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# IMPORTANT: override JWT_SECRET in any real deployment. This default is for local dev only.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-to-something-long-and-random-before-deploying}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- CORS ---
# Comma-separated list of allowed origins for the frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Server ---
server.port=${PORT:8080}


